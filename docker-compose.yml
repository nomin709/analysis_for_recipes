services:
  site:
    image: jekyll/jekyll:latest
    command: >
      sh -c "bundle config set --local path 'vendor/bundle' &&
             bundle install &&
             bundle exec jekyll serve --host 0.0.0.0 --force_polling --livereload"
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development